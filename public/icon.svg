<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- CAD Grid Lines -->
  <g stroke="#1e293b" stroke-width="2">
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" stroke="#334155" stroke-width="3" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />

    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" stroke="#334155" stroke-width="3" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="96" y1="416" x2="416" y2="416" />
  </g>

  <!-- Connected CAD Polyline (Survey Vector) -->
  <path d="M 130 360 L 220 200 L 320 280 L 390 140" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Secondary Survey line -->
  <path d="M 220 200 L 370 230" fill="none" stroke="#64748b" stroke-dasharray="8 8" stroke-width="4" />

  <!-- Survey Nodes (Points) -->
  <g filter="url(#glow)">
    <!-- Point 1 -->
    <circle cx="130" cy="360" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="5" />
    <circle cx="130" cy="360" r="4" fill="#ffffff" />

    <!-- Point 2 -->
    <circle cx="220" cy="200" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
    <circle cx="220" cy="200" r="5" fill="#ffffff" />

    <!-- Point 3 -->
    <circle cx="320" cy="280" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="5" />
    <circle cx="320" cy="280" r="4" fill="#ffffff" />

    <!-- Point 4 (Active/Snap) -->
    <circle cx="390" cy="140" r="18" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <circle cx="390" cy="140" r="6" fill="#ffffff" />
    <!-- Magnetic snap box around point 4 -->
    <rect x="368" y="118" width="44" height="44" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="5 3" rx="6" />
  </g>

  <!-- Badge / Logo Text "CAD GIS" -->
  <rect x="156" y="400" width="200" height="48" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">WEB CAD</text>
</svg>
